control:
  name: Control cleaning queue
  description: Start an ordered native room/area plan, pause, resume, clear future
    work, stop or return to dock.
  fields:
    command:
      required: true
      selector:
        select:
          options:
          - start_manual
          - pause
          - resume
          - cancel
          - return_to_dock
          - stop
          - toggle
          - toggle_saved
    vacuum:
      selector:
        entity:
          domain: vacuum
          integration: roborock
    rooms:
      description: Ordered room objects with id and per-room settings, or legacy mapped-area
        IDs. An explicitly empty list through this API cleans the current map.
      selector:
        object: {}
    setup:
      description: Manual mode, suction, water, route and repeat options returned
        by get_capabilities. Used only by start_manual.
      selector:
        object: {}
get_capabilities:
  name: Get manual cleaning capabilities
  description: Read cached native cleaning modes, settings and mapped areas for the
    current map. Does not change settings, switch maps, poll or start the robot. Returns
    a response.
  fields:
    vacuum:
      required: true
      selector:
        entity:
          domain: vacuum
          integration: roborock
device_control:
  name: Control native robot and dock
  description: Change one available native control, or find the robot. Dock and settings
    commands share the queue lock and wait for native readback; no automatic retries.
  fields:
    vacuum:
      required: true
      selector:
        entity:
          domain: vacuum
          integration: roborock
    control:
      required: true
      selector:
        select:
          options:
          - locate
          - dust_emptying
          - mop_washing
          - mop_drying
          - volume
          - dnd
          - dnd_start
          - dnd_end
          - child_lock
          - empty_mode
          - selected_map
          - off_peak
          - off_peak_start
          - off_peak_end
    value:
      description: Switches use on/off; volume uses a number; times use HH:MM; empty_mode
        uses a native option. Omit for locate.
      selector:
        text: {}
save_preset:
  name: Save cleaning plan
  description: Save one validated native room/area plan for this robot, without changing
    settings or starting cleaning. Replaces the previous saved plan.
  fields:
    vacuum:
      required: true
      selector:
        entity:
          domain: vacuum
          integration: roborock
    source:
      required: true
      selector:
        select:
          options:
          - rooms
          - manual
    rooms:
      selector:
        object: {}
    setup:
      selector:
        object: {}
get_diagnostics:
  name: Get queue diagnostics
  description: Read the queue and recent controller events for the authorized robot.
    No robot commands.
  fields:
    vacuum:
      required: true
      selector:
        entity:
          domain: vacuum
          integration: roborock

save_preferences:
  name: Save shared room settings
  description: Persist defaults and current-map room preferences for all users. Does not change the robot or saved wall-switch plan. Concurrent stale saves are rejected.
  fields:
    vacuum:
      required: true
      selector:
        entity:
          domain: vacuum
    revision:
      required: true
      selector:
        number:
          min: 0
          mode: box
    map_id:
      required: true
      selector:
        number:
          min: 0
          mode: box
    defaults:
      required: true
      selector:
        object:
    rooms:
      required: true
      selector:
        object:
