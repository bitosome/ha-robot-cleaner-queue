robot_cleaner_queue: {}
script:
  robot_cleaner_queue_control:
    alias: Robot cleaner queue control
    description: Wrapper used by the card. Queue execution belongs to Home Assistant.
    mode: parallel
    max: 10
    fields:
      command:
        required: true
        selector:
          select:
            options:
            - start_manual
            - pause
            - resume
            - cancel
            - return_to_dock
            - stop
            - toggle_saved
            - continue_sequence
            - resume_now
      vacuum:
        selector:
          entity:
            domain: vacuum
            integration: roborock
      run_id:
        description: Current queue run_id for explicit continuation.
        selector:
          text: {}
      current_index:
        description: Current queue pass index for explicit continuation.
        selector:
          number:
            min: 0
            mode: box
      water_refilled:
        description: Confirm the clean-water tank was refilled for this interrupted pass.
        selector:
          boolean: {}
      rooms:
        description: Ordered native room objects or mapped-area IDs.
        selector:
          object: null
      setup:
        description: Manual cleaning settings from robot_cleaner_queue.get_capabilities.
        selector:
          object: null
    sequence:
    - choose:
      - conditions: '{{ command == ''start_manual'' }}'
        sequence:
        - action: robot_cleaner_queue.control
          data:
            command: start_manual
            vacuum: '{{ vacuum }}'
            rooms: '{{ rooms | default([]) }}'
            setup: '{{ setup | default({}) }}'
      - conditions: '{{ command in [''continue_sequence'', ''resume_now''] }}'
        sequence:
        - action: robot_cleaner_queue.control
          data:
            command: '{{ command }}'
            vacuum: '{{ vacuum }}'
            run_id: '{{ run_id }}'
            current_index: '{{ current_index }}'
            water_refilled: '{{ water_refilled | default(false) }}'
      default:
      - action: robot_cleaner_queue.control
        data:
          command: '{{ command }}'
          vacuum: '{{ vacuum | default('''') }}'
